<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MallOfR3ps</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23f4f0e7'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='40' text-anchor='middle' fill='%23161514'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: brand masthead (the logo set in type), sticky tab bar, product grid / order form / owner catalog editor below. One committed light look in the logo's beige. */
:root{
  --bg:#f4f0e7; --card:#fbf9f4; --sunk:#ece6da; --line:#e0d8c8; --ink:#161514; --muted:#6b6457; --gold:#8a7a5f;
  --accent:#161514; --accent-fg:#f4f0e7; --ok:#2f6b47; --ok-soft:#e1ecdf; --err:#a33a2b; --err-soft:#f6e3df;
  --f-brand:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mast{text-align:center;padding-block:34px 18px}
.mast h1{font-family:var(--f-brand);font-weight:400;font-size:clamp(36px,7vw,54px);margin:0;letter-spacing:-.01em;line-height:1.05}
.mast .rule{width:120px;height:1px;background:var(--gold);margin:14px auto 12px}
.mast .since{font-size:12px;letter-spacing:.42em;color:var(--gold);padding-left:.42em}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;justify-content:center;padding-block:8px;flex-wrap:wrap}
.tab{border:0;background:none;padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--accent-fg)}
.tab .n{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:var(--gold);color:#fff;font-size:12px;margin-left:6px;padding:0 6px}
main{padding-block:22px 80px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{flex:1;min-width:200px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--accent-fg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.p{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.p .img{aspect-ratio:1/1;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:12px;max-width:100%}
.p .img img{width:100%;height:100%;object-fit:cover;display:block}
.p .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.brand{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.name{font-family:var(--f-brand);font-size:17px;line-height:1.25}
.desc{font-size:13px;color:var(--muted);margin:0}
.price{font-weight:600;font-variant-numeric:tabular-nums;margin-top:auto}
.p select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ink);background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);font-size:14px}
.btn.solid{background:var(--ink);color:var(--accent-fg)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.ghost{border-color:transparent}
.btn.danger{color:var(--err);border-color:var(--err-soft)}
.btn:disabled{opacity:.45;cursor:default}
.sold{font-size:12px;font-weight:600;color:var(--err)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{font-family:var(--f-brand);font-weight:400;color:var(--ink);margin:0;font-size:22px}
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:800px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-family:var(--f-brand);font-weight:400;font-size:22px;margin:0}
.line{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .th{width:64px;height:64px;border-radius:8px;background:var(--sunk);object-fit:cover}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{border:0;background:none;width:30px;height:30px;cursor:pointer;font-size:16px}
.qty span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.sum{display:flex;justify-content:space-between;font-weight:600;font-variant-numeric:tabular-nums;padding-top:10px;border-top:1px solid var(--line)}
.note{font-size:13px;color:var(--muted);margin:0}
.fg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:5px;grid-column:span 3;min-width:0}
.f.s6{grid-column:span 6}.f.s2{grid-column:span 2}.f.s4{grid-column:span 4}
@media (max-width:560px){.f,.f.s2,.f.s4{grid-column:span 6}}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;width:18px;height:18px}
.err{color:var(--err);font-size:13.5px}
.done{display:flex;flex-direction:column;gap:14px}
.msg{white-space:pre-wrap;background:var(--sunk);border-radius:10px;padding:14px;font-size:13.5px;margin:0;overflow-wrap:anywhere;user-select:text;font-family:var(--f-body)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.addr{font-weight:600;user-select:all}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--accent-fg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px}
.admin-bar{background:var(--ink);color:var(--accent-fg)}
.admin-bar .wrap{display:flex;gap:10px;align-items:center;padding-block:10px;flex-wrap:wrap;font-size:13.5px}
.admin-bar .btn{border-color:var(--accent-fg);color:var(--accent-fg)}
.admin-bar .btn.solid{background:var(--accent-fg);color:var(--ink)}
.mrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .th{width:56px;height:56px;border-radius:8px;background:var(--sunk);object-fit:cover;display:grid;place-items:center;font-size:10px;color:var(--muted)}
.drop{width:120px;height:120px;border:1.5px dashed var(--gold);border-radius:10px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;overflow:hidden;position:relative;background:var(--bg)}
.drop img{width:100%;height:100%;object-fit:cover}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.price.ask{font-weight:500;color:var(--muted);font-style:italic}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px 3px 3px;font-size:12.5px;cursor:pointer;max-width:100%}
.sw img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.sw:not(:has(img)){padding-left:10px}
.sw[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--accent-fg)}
.vars{display:flex;flex-direction:column;gap:10px}
.var{display:flex;gap:12px;align-items:center}
.drop.sm{width:72px;height:72px;flex:none}
.gatebox{max-width:420px;margin:10px auto 40px;text-align:left}
.pwbox{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;border:1px dashed var(--line);border-radius:10px;padding:12px}
.pwbox input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;width:100%}
.foot{text-align:center;color:var(--muted);font-size:13px;padding-block:20px 40px;line-height:1.9}
.foot a{color:var(--ink);text-decoration:none}

</style>
</head>
<body>
<header class="mast wrap"><h1>MallOfR3ps</h1><div class="rule"></div><div class="since">SINCE 2023</div></header>
<nav class="tabs" aria-label="Bereiche" hidden><div class="wrap" id="tabs"></div></nav>
<div class="wrap" id="gate" hidden></div>
<main class="wrap" id="main" hidden></main>
<footer class="foot wrap">info.mallofr3ps@gmail.com<br><a href="https://www.instagram.com/mallofr3ps" target="_blank" rel="noopener">Instagram @mallofr3ps</a> · <a href="https://www.tiktok.com/@mallofr3ps" target="_blank" rel="noopener">TikTok @mallofr3ps</a></footer>
<div id="toast" class="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
<script>
const SHOP={mail:'info.mallofr3ps@gmail.com',insta:'mallofr3ps',tiktok:'mallofr3ps'};
const EJS={service:'service_i9wufqd',template:'template_y8awzok',key:'CQDupc8N4vqzgwCGl'};
const GATE={h:'1x1ss8a9ex5'};
let CATALOG=[];
const st={tab:'katalog',q:'',cat:'alle',pick:{},cart:[],order:null,sending:false,open:false,loaded:false};
try{const c=JSON.parse(localStorage.getItem('mr-cart')||'[]');if(Array.isArray(c))st.cart=c}catch{}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=new Intl.NumberFormat('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2});
const chf=n=>'CHF '+fmt.format(+n||0);
function pwHash(str,seed=7){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function unlocked(){if(!GATE.h)return true;try{return localStorage.getItem('mr-pass')===GATE.h}catch{return false}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function saveCart(){try{localStorage.setItem('mr-cart',JSON.stringify(st.cart))}catch{}}
function prod(id){return CATALOG.find(p=>p.id===id)}
function vars(p){return (p.varianten&&p.varianten.length)?p.varianten:(p.farben||[]).map(f=>({farbe:f,bild:''}))}
function imgFor(p,farbe){const v=vars(p);const m=v.find(x=>x.farbe===farbe&&x.bild);return m?m.bild:(p.bild||(v.find(x=>x.bild)||{}).bild||'')}
function hasPrice(p){return p&&p.preis!==''&&p.preis!=null&&+p.preis>0}
function priceTxt(p){return hasPrice(p)?chf(p.preis):'Preis auf Anfrage'}
function title(p){return [p.marke,p.name].filter(Boolean).join(' ')}
function cartLines(){return st.cart.filter(c=>prod(c.pid))}
function cartCount(){return cartLines().reduce((a,c)=>a+c.menge,0)}
function cartTotal(){return cartLines().reduce((a,c)=>a+(hasPrice(prod(c.pid))?+prod(c.pid).preis:0)*c.menge,0)}
function cats(){return [...new Set(CATALOG.map(p=>p.kategorie).filter(Boolean))]}

function render(){
  const open=st.open||unlocked();
  const g=document.getElementById('gate');document.querySelector('.tabs').hidden=!open;document.getElementById('main').hidden=!open;
  if(!open){g.hidden=false;if(!g.firstChild)g.innerHTML=`<form class="card gatebox" id="gf" novalidate><h2>Willkommen</h2><p class="note">Dieser Shop ist nur für Kunden von MallOfR3ps. Gib das Passwort ein, das du von uns bekommen hast.</p><div class="f s6"><label for="g_pw">Passwort</label><input id="g_pw" name="pw" type="password" autocomplete="current-password" autofocus></div><div id="gerr" class="err" role="alert"></div><button class="btn solid" type="submit">Eintreten</button><p class="note">Noch kein Passwort? Schreib uns auf <a href="https://ig.me/m/${SHOP.insta}" target="_blank" rel="noopener" style="color:inherit">Instagram @${SHOP.insta}</a>.</p></form>`;return}
  g.hidden=true;g.innerHTML='';renderTabs();renderMain()}
function renderTabs(){
  const n=cartCount();const t=[['katalog','Katalog'],['bestellen','Bestellen'+(n?`<span class="n">${n}</span>`:'')]];
  document.getElementById('tabs').innerHTML=t.map(([k,l])=>`<button class="tab" role="tab" data-a="tab" data-k="${k}" aria-selected="${st.tab===k}">${l}</button>`).join('');
}
function renderMain(){
  const m=document.getElementById('main');
  m.innerHTML=st.tab==='katalog'?viewCatalog():(st.order?viewDone():viewOrder());
  const q=document.getElementById('q');if(q)q.value=st.q;
}
function matches(p){const q=st.q.toLowerCase().trim();if(st.cat!=='alle'&&p.kategorie!==st.cat)return false;if(!q)return true;return [p.marke,p.name,p.kategorie,p.beschreibung,...vars(p).map(v=>v.farbe)].join(' ').toLowerCase().includes(q)}
function viewCatalog(){
  if(!st.loaded)return `<p class="note" style="text-align:center">Katalog wird geladen …</p>`;
  if(!CATALOG.length)return `<div class="empty"><h2>Der Katalog kommt bald</h2><p style="margin:0;max-width:42ch">Du suchst etwas Bestimmtes? Beschreib dein Wunschprodukt unter «Bestellen» oder schick uns ein Foto auf Instagram.</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn solid" data-a="tab" data-k="bestellen">Wunschprodukt bestellen</button><a class="btn" href="https://ig.me/m/${SHOP.insta}" target="_blank" rel="noopener">Instagram</a></div></div>`;
  const c=cats();const items=CATALOG.filter(matches);
  return `<div class="bar"><input id="q" class="search" type="search" placeholder="Suche nach Marke, Produkt oder Farbe" aria-label="Produkte suchen">${c.length>1?`<div class="chips">${['alle',...c].map(k=>`<button class="chip" data-a="cat" data-k="${esc(k)}" aria-pressed="${st.cat===k}">${k==='alle'?'Alle':esc(k)}</button>`).join('')}</div>`:''}</div>
  <div class="grid" id="grid">${items.map(card).join('')||'<p class="note">Nichts gefunden.</p>'}</div>
  <p class="note" style="margin-top:22px;text-align:center">Nicht dabei, was du suchst? Beschreib dein Wunschprodukt unter <a href="#" data-a="tab" data-k="bestellen" style="color:inherit">Bestellen</a>, wir besorgen es dir.</p>`;
}
function card(p){
  const g=p.groessen||[],v=vars(p),pk=st.pick[p.id]||{};
  const cur=pk.farbe||(v[0]||{}).farbe||'';const im=imgFor(p,cur);
  return `<article class="p" data-pid="${esc(p.id)}"><div class="img">${im?`<img src="${esc(im)}" alt="${esc(title(p)+(cur?' – '+cur:''))}" loading="lazy">`:'Kein Foto'}</div><div class="body">
   ${p.name?`<div class="brand">${esc(p.marke)}</div><div class="name">${esc(p.name)}</div>`:`<div class="name">${esc(p.marke)}</div>`}${p.beschreibung?`<p class="desc">${esc(p.beschreibung)}</p>`:''}
   ${v.length>1?`<div class="swatches" role="group" aria-label="Farbe wählen">${v.map(x=>`<button class="sw" data-a="color" data-id="${esc(p.id)}" data-f="${esc(x.farbe)}" aria-pressed="${cur===x.farbe}">${x.bild?`<img src="${esc(x.bild)}" alt="">`:''}<span>${esc(x.farbe)}</span></button>`).join('')}</div>`:(v.length===1?`<div class="note">Farbe: ${esc(v[0].farbe)}</div>`:'')}
   ${p.verfuegbar===false?'<span class="sold">Momentan ausverkauft</span>':(g.length?`<select data-a="pick" data-id="${esc(p.id)}" data-k="groesse" aria-label="Grösse wählen"><option value="">Grösse wählen</option>${g.map(x=>`<option ${pk.groesse===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:'')}
   <div class="price ${hasPrice(p)?'':'ask'}">${priceTxt(p)}</div>
   ${p.verfuegbar===false?'':`<button class="btn solid sm" data-a="add" data-id="${esc(p.id)}">In den Warenkorb</button>`}
  </div></article>`;
}
function viewOrder(){
  const lines=cartLines();const anyAsk=lines.some(c=>!hasPrice(prod(c.pid)));
  return `<div class="cols"><section class="card"><h2>Deine Auswahl</h2>
   ${lines.length?`<div>${lines.map((c,i)=>{const p=prod(c.pid);const im=imgFor(p,c.farbe);return `<div class="line">${im?`<img class="th" src="${esc(im)}" alt="">`:'<span class="th"></span>'}<div style="min-width:0"><div class="brand">${esc(p.name?p.marke:'')}</div><div style="font-weight:600">${esc(p.name||p.marke)}</div><div class="note">${[c.groesse&&'Gr. '+esc(c.groesse),c.farbe&&esc(c.farbe)].filter(Boolean).join(' · ')}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><span class="qty"><button data-a="minus" data-i="${i}" aria-label="Weniger">−</button><span>${c.menge}</span><button data-a="plus" data-i="${i}" aria-label="Mehr">+</button></span><span style="font-variant-numeric:tabular-nums">${hasPrice(p)?chf(p.preis*c.menge):'auf Anfrage'}</span></div></div>`}).join('')}</div>
   ${cartTotal()>0?`<div class="sum"><span>Zwischensumme${anyAsk?' (ohne Anfrage-Artikel)':''}</span><span>${chf(cartTotal())}</span></div>`:''}<p class="note">Preise${anyAsk?', ':' '}Versandkosten und allfällige Rabatte bestätigen wir dir persönlich.</p>`
   :`<p class="note">Dein Warenkorb ist leer. Wähle im Katalog ein Produkt aus, oder beschreib dein Wunschprodukt unten im Feld «Bemerkung».</p><button class="btn sm" data-a="tab" data-k="katalog" style="align-self:flex-start">Zum Katalog</button>`}
  </section>
  <form class="card" id="of" novalidate><h2>Deine Angaben</h2><div class="fg">
   ${fi('vorname','Vorname *','','given-name')}${fi('nachname','Nachname *','','family-name')}
   ${fi('strasse','Strasse und Nr. *','s6','street-address')}
   ${fi('plz','PLZ *','s2','postal-code')}${fi('ort','Ort *','s4','address-level2')}
   ${fi('land','Land *','','country-name','Schweiz')}${fi('email','E-Mail *','','email','','email')}
   ${fi('telefon','Telefon','','tel','','tel')}${fi('instagram','Instagram','','off','','text','@deinname')}
   <div class="f s6"><label for="o_bem">Bemerkung oder Wunschprodukt</label><textarea id="o_bem" name="bemerkung" placeholder="z. B. Wunschprodukt mit Grösse und Farbe, Liefertermin"></textarea></div>
  </div>
  <label class="check"><input type="checkbox" name="neukunde" id="o_neu"> <span>Das ist meine erste Bestellung bei MallOfR3ps (15 % Neukunden-Rabatt)</span></label>
  <div id="oerr" class="err" role="alert"></div>
  <button class="btn solid" type="submit" id="obtn" ${st.sending?'disabled':''}>${st.sending?'Bestellung wird gesendet …':'Bestellung absenden'}</button>
  <p class="note">Du bekommst sofort eine Bestellbestätigung per E-Mail. Die Preise und Zahlungsinfos schicken wir dir danach persönlich. Deine Angaben verwenden wir nur für deine Bestellung.</p>
  </form></div>`;
}
function fi(n,l,cls='',ac='',val='',type='text',ph=''){return `<div class="f ${cls}"><label for="o_${n}">${l}</label><input id="o_${n}" name="${n}" type="${type}" autocomplete="${ac}" value="${esc(val)}" ${ph?`placeholder="${esc(ph)}"`:''}></div>`}
function viewDone(){
  const o=st.order;
  return `<section class="card done" style="max-width:640px;margin:0 auto"><h2>Danke, ${esc(o.vorname)}!</h2>
   ${o.confirmed?`<p style="margin:0">Deine Bestellung <b>${esc(o.nr)}</b> ist bei uns eingegangen. Eine Bestellbestätigung ist unterwegs an <b>${esc(o.email)}</b>. Schau auch im Spam-Ordner nach, falls sie nicht gleich kommt.</p>`
    :`<p style="margin:0">Deine Bestellung <b>${esc(o.nr)}</b> ist bei uns eingegangen. Die Bestätigungs-Mail an dich konnte gerade nicht verschickt werden. Keine Sorge, wir melden uns trotzdem bei dir.</p>`}
   <p style="margin:0">MallOfR3ps meldet sich in Kürze mit den Preisen und den Zahlungsinfos bei dir.</p>
   <button class="btn sm" data-a="neworder" style="align-self:flex-start">Neue Bestellung</button></section>`;
}
/* ---- mails ---- */
function orderText(o){
  const L=[`🛍️ NEUE BESTELLUNG – MallOfR3ps`,`Bestell-Nr.: ${o.nr}`,`————————`];
  o.items.forEach(i=>L.push(`${i.menge}× ${i.marke||'–'} | ${i.name||'–'} | Gr. ${i.groesse||'–'} | ${i.farbe||'–'} | ${i.preis>0?'à CHF '+fmt.format(i.preis):'Preis auf Anfrage'}`));
  if(!o.items.length)L.push('(kein Produkt aus dem Katalog)');
  L.push('————————');if(o.total>0)L.push(`Zwischensumme: CHF ${fmt.format(o.total)}`);L.push(`Neukunde: ${o.neukunde?'Ja':'Nein'}`,'————————',
    `Name: ${o.vorname} ${o.nachname}`,`Adresse: ${o.strasse}, ${o.plz} ${o.ort}, ${o.land}`,`E-Mail: ${o.email}`);
  if(o.telefon)L.push(`Telefon: ${o.telefon}`);if(o.instagram)L.push(`Instagram: @${o.instagram.replace(/^@/,'')}`);
  if(o.bemerkung)L.push(`Bemerkung: ${o.bemerkung.replace(/\s*\n+\s*/g,' ')}`);
  L.push(`Bestätigung: ${o.confirmed?'automatisch gesendet':'nicht gesendet'}`);
  return L.join('\n');
}
const SERIF="Georgia,'Times New Roman',serif",SANS="Helvetica,Arial,sans-serif";
function mailHead(){return `<table width="100%" cellpadding="0" cellspacing="0" bgcolor="#f4f0e7" style="background-color:#f4f0e7"><tr><td align="center" style="padding:30px 14px"><table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px"><tr><td align="center" style="padding:10px 0 26px"><div style="font-family:${SERIF};font-size:40px;line-height:1.1;color:#141414">MallOfR3ps</div><table cellpadding="0" cellspacing="0" align="center" style="margin:14px auto 12px"><tr><td width="120" height="1" bgcolor="#8a7a5f" style="background-color:#8a7a5f;width:120px;height:1px;font-size:0;line-height:1px">&nbsp;</td></tr></table><div style="font-family:${SANS};font-size:12px;letter-spacing:.42em;color:#8a7a5f">SINCE 2023</div></td></tr><tr><td bgcolor="#fbf9f4" style="background-color:#fbf9f4;border:1px solid #e4ddcf;border-radius:10px;padding:30px 28px">`}
function mailFoot(){return `</td></tr><tr><td align="center" style="padding:24px 10px 6px;font-family:${SANS};font-size:13px;line-height:1.9;color:#6b6457"><a href="mailto:${SHOP.mail}" style="color:#1a1a1a;text-decoration:none">${SHOP.mail}</a><br><a href="https://www.instagram.com/${SHOP.insta}" style="color:#1a1a1a;text-decoration:none">Instagram @${SHOP.insta}</a> &nbsp;·&nbsp; <a href="https://www.tiktok.com/@${SHOP.tiktok}" style="color:#1a1a1a;text-decoration:none">TikTok @${SHOP.tiktok}</a></td></tr></table></td></tr></table>`}
function itemRows(o){return o.items.map(i=>{const attrs=[i.groesse?'Grösse '+esc(i.groesse):'',i.farbe?esc(i.farbe):'',(+i.menge||1)+'×'].filter(Boolean).join(' · ');
  return `<tr><td style="padding:14px 0;border-top:1px solid #e4ddcf;font-family:${SERIF};color:#1a1a1a">${i.marke&&i.name?`<div style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8a7a5f;font-family:${SANS}">${esc(i.marke)}</div>`:''}<div style="font-size:17px;line-height:1.35;margin-top:2px">${esc(i.name||i.marke)}</div><div style="font-size:13px;color:#6b6457;margin-top:4px;font-family:${SANS}">${attrs}</div></td></tr>`}).join('')}
function adrHtml(o){return [o.vorname+' '+o.nachname,o.strasse,o.plz+' '+o.ort,o.land].map(esc).join('<br>')}
function confHtml(o){
  return mailHead()+`<div style="font-family:${SANS};font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#8a7a5f">Bestellbestätigung</div>
<h1 style="font-family:${SERIF};font-weight:normal;font-size:28px;line-height:1.2;color:#1a1a1a;margin:10px 0 14px">Deine Bestellung ist eingegangen</h1>
<p style="font-family:${SANS};font-size:15px;line-height:1.6;color:#3d3a33;margin:0 0 6px">Hey ${esc(o.vorname)} 👋</p>
<p style="font-family:${SANS};font-size:15px;line-height:1.6;color:#3d3a33;margin:0 0 18px">danke für deine Bestellung <strong style="color:#1a1a1a">${esc(o.nr)}</strong>! Wir haben sie erhalten.</p>
<table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:18px"><tr><td bgcolor="#1a1a1a" style="background-color:#1a1a1a;border-radius:8px;padding:14px 18px;font-family:${SANS};font-size:15px;line-height:1.5;color:#f4f0e7">MallOfR3ps meldet sich in Kürze mit den Preisen und den Zahlungsinfos bei dir.</td></tr></table>
<div style="font-family:${SANS};font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8a7a5f;margin-top:8px">Deine Bestellung</div>
${o.items.length?`<table width="100%" cellpadding="0" cellspacing="0">${itemRows(o)}</table>`:''}
${o.bemerkung?`<p style="font-family:${SANS};font-size:14px;line-height:1.6;color:#3d3a33;margin:10px 0 0"><b>Deine Bemerkung:</b> ${esc(o.bemerkung)}</p>`:''}
${o.neukunde?`<p style="font-family:${SANS};font-size:14px;color:#3d3a33;margin:10px 0 0">🎁 Neukunden-Rabatt: 15 % auf deine erste Bestellung</p>`:''}
<table width="100%" cellpadding="0" cellspacing="0" style="margin-top:16px"><tr><td bgcolor="#f1ebdf" style="background-color:#f1ebdf;border-radius:8px;padding:16px 18px;font-family:${SANS};font-size:14px;line-height:1.6;color:#1a1a1a"><div style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8a7a5f;margin-bottom:4px">Lieferadresse</div>${adrHtml(o)}</td></tr></table>
<p style="font-family:${SANS};font-size:13.5px;line-height:1.6;color:#6b6457;margin:18px 0 0">Fragen oder etwas ändern? Antworte einfach auf diese Mail.</p>
<p style="font-family:${SERIF};font-size:17px;color:#1a1a1a;margin:20px 0 0">Danke für dein Vertrauen 🖤</p>`+mailFoot();
}
function ownerHtml(o){
  return mailHead()+`<div style="font-family:${SANS};font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#8a7a5f">Neue Bestellung</div>
<h1 style="font-family:${SERIF};font-weight:normal;font-size:26px;line-height:1.2;color:#1a1a1a;margin:10px 0 14px">${esc(o.vorname)} ${esc(o.nachname)} hat bestellt</h1>
<table width="100%" cellpadding="0" cellspacing="0">${itemRows(o)}</table>
<p style="font-family:${SANS};font-size:14px;line-height:1.6;color:#3d3a33;margin:12px 0 0">${o.neukunde?'<b>Neukunde</b> (15 % Rabatt) · ':''}${esc(o.email)}${o.telefon?' · '+esc(o.telefon):''}${o.instagram?' · @'+esc(o.instagram.replace(/^@/,'')):''}</p>
<p style="font-family:${SANS};font-size:13px;color:#6b6457;margin:14px 0 6px">Diese Bestellung erscheint automatisch in deinem Bestellsystem.</p>
<pre style="font-family:'Courier New',monospace;font-size:12.5px;line-height:1.5;white-space:pre-wrap;background:#f1ebdf;border-radius:8px;padding:12px;color:#1a1a1a;margin:0">${esc(orderText(o))}</pre>`+mailFoot();
}
async function sendMail(params){if(!window.emailjs)throw new Error('emailjs fehlt');return emailjs.send(EJS.service,EJS.template,params,{publicKey:EJS.key})}
async function submitOrder(form){
  const d=Object.fromEntries(new FormData(form).entries());const err=document.getElementById('oerr');err.textContent='';
  for(const k of ['vorname','nachname','strasse','plz','ort','land','email','telefon','instagram','bemerkung'])d[k]=(d[k]||'').trim();
  const miss=[['vorname','Vorname'],['nachname','Nachname'],['strasse','Strasse'],['plz','PLZ'],['ort','Ort'],['land','Land'],['email','E-Mail']].filter(([k])=>!d[k]).map(([,l])=>l);
  if(miss.length){err.textContent='Bitte noch ausfüllen: '+miss.join(', ')+'.';return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)){err.textContent='Die E-Mail-Adresse sieht nicht richtig aus.';return}
  const items=cartLines().map(c=>{const p=prod(c.pid);return{marke:p.marke||'',name:p.name||'',groesse:c.groesse,farbe:c.farbe,menge:c.menge,preis:hasPrice(p)?+p.preis:0}});
  if(!items.length&&!d.bemerkung){err.textContent='Wähle ein Produkt im Katalog oder beschreib dein Wunschprodukt in der Bemerkung.';return}
  const n=new Date(),p2=x=>String(x).padStart(2,'0');
  const o={...d,neukunde:!!d.neukunde,items,total:items.reduce((a,i)=>a+i.preis*i.menge,0),nr:`W${String(n.getFullYear()).slice(2)}${p2(n.getMonth()+1)}${p2(n.getDate())}-${Math.random().toString(36).slice(2,6).toUpperCase()}`,confirmed:false};
  st.sending=true;renderMain();
  let confOk=false;
  try{await sendMail({to_email:o.email,reply_to:SHOP.mail,subject:`Bestellbestätigung ${o.nr} – MallOfR3ps`,html:confHtml(o)});confOk=true}catch(e){console.warn('Bestätigung',e)}
  o.confirmed=confOk;
  let ownerOk=false;
  try{await sendMail({to_email:SHOP.mail,reply_to:o.email,subject:`Neue Bestellung ${o.nr} – ${o.vorname} ${o.nachname}`,html:ownerHtml(o)});ownerOk=true}catch(e){console.warn('Bestellung',e)}
  st.sending=false;
  if(!ownerOk&&!confOk){renderMain();document.getElementById('oerr').innerHTML=`Die Bestellung konnte gerade nicht gesendet werden. Versuch es in einer Minute nochmals, oder schick uns deine Bestellung per Instagram an <a href="https://ig.me/m/${SHOP.insta}" target="_blank" rel="noopener">@${SHOP.insta}</a>.`;return}
  st.order=o;st.cart=[];saveCart();render();window.scrollTo(0,0);
}
/* ---- events ---- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
  if(a==='tab'){e.preventDefault();st.tab=t.dataset.k;render();window.scrollTo(0,0)}
  else if(a==='cat'){st.cat=t.dataset.k;renderMain()}
  else if(a==='color'){(st.pick[t.dataset.id]||(st.pick[t.dataset.id]={})).farbe=t.dataset.f;const art=t.closest('.p');const p=prod(t.dataset.id);if(art&&p)art.outerHTML=card(p)}
  else if(a==='add'){const p=prod(t.dataset.id),pk=st.pick[p.id]||{};
    if((p.groessen||[]).length&&!pk.groesse){toast('Bitte zuerst die Grösse wählen');return}
    const farbe=pk.farbe||((vars(p)[0]||{}).farbe||'');
    const ex=st.cart.find(c=>c.pid===p.id&&c.groesse===(pk.groesse||'')&&c.farbe===farbe);
    if(ex)ex.menge++;else st.cart.push({pid:p.id,groesse:pk.groesse||'',farbe,menge:1});
    saveCart();renderTabs();toast('Im Warenkorb')}
  else if(a==='plus'||a==='minus'){const c=cartLines()[+t.dataset.i];if(!c)return;c.menge+=a==='plus'?1:-1;if(c.menge<1)st.cart.splice(st.cart.indexOf(c),1);saveCart();render()}
  else if(a==='neworder'){st.order=null;renderMain()}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.a==='pick'){(st.pick[t.dataset.id]||(st.pick[t.dataset.id]={}))[t.dataset.k]=t.value}});
document.addEventListener('input',e=>{if(e.target.id==='q'){st.q=e.target.value;const g=document.getElementById('grid');if(g)g.innerHTML=CATALOG.filter(matches).map(card).join('')||'<p class="note">Nichts gefunden.</p>'}});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='gf'){const v=(new FormData(e.target).get('pw')||'').trim();
    if(pwHash(v)===GATE.h){try{localStorage.setItem('mr-pass',GATE.h)}catch{}st.open=true;render()}
    else{document.getElementById('gerr').textContent='Das Passwort stimmt nicht. Achte auf Gross- und Kleinschreibung.';document.getElementById('g_pw').select()}return}
  if(e.target.id==='of'&&!st.sending)submitOrder(e.target);
});
render();
fetch('catalog.json',{cache:'no-cache'}).then(r=>r.ok?r.json():[]).then(c=>{CATALOG=Array.isArray(c)?c:[]}).catch(()=>{}).finally(()=>{st.loaded=true;st.cart=st.cart.filter(c=>prod(c.pid));if(st.open||unlocked())render()});

</script>
</body>
</html>
